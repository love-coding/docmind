name: DocMind CI

# 什么时候触发：push 代码到 main 分支时
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 要做什么
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: PYTHONPATH=. pytest tests/ -v

  build:
    needs: test           # 测试通过后才构建镜像
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 构建 Docker 镜像
        run: docker build -t docmind:latest .
